name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: jpf
          POSTGRES_HOST_AUTH_METHOD: trust
          POSTGRES_DB: jpf_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U jpf" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://jpf@localhost:5432/jpf_test
      TEST_DATABASE_URL: postgresql://jpf@localhost:5432/jpf_test
      BETTER_AUTH_SECRET: ci-only-secret-value-that-is-long-enough-123
      BETTER_AUTH_URL: http://localhost:3000
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run content:check --if-present
      - run: npm test
      - run: npm run build
